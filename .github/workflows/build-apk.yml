name: Build Android APK (Wildwood Reality)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web bundle
        run: |
          npm install
          npm run build

      - name: Generate and configure Capacitor Android wrapper
        run: |
          rm -rf android
          npx cap add android
          node scripts/configure-android.mjs
          npx cap sync android

      - name: Compile installable Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Wildwood-Reality.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./Wildwood-Reality.apk

      - name: Upload APK Workflow Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Wildwood-Reality-APK
          path: Wildwood-Reality.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Wildwood Reality APK (Build #${{ github.run_number }})
          body: |
            Ready-to-install Android APK for **Wildwood: Reality** (Three.js WebGL2 wrapped with Capacitor).
            Download `Wildwood-Reality.apk` below directly on your Android phone and tap to install.
          files: Wildwood-Reality.apk
